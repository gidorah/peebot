[project]
name = "peebot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "atproto>=0.0.65",
    "celery>=5.5.3",
    "defusedxml>=0.7.1",
    "django>=5.2.7",
    "django-celery-beat>=2.8.1",
    "django-environ>=0.12.0",
    "django-structlog>=10.0.0",
    "djangorestframework>=3.16.1",
    "flower>=2.0.1",
    "lightstreamer-client-lib>=2.2.2",
    "openai>=1.60.0",
    "psycopg[binary,pool]>=3.2.11",
    "pydantic>=2.12.5",
    "redis>=6.4.0",
    "rich>=14.2.0",
    "seqlog>=0.4.3",
    "structlog>=25.5.0",
]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
plugins = ["mypy_django_plugin.main"]
exclude = ["migrations/", "tests/", "_work-tmp"]

[[tool.mypy.overrides]]
module = "django_celery_beat.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "django_celery_results.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "lightstreamer.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "celery.*"
ignore_missing_imports = true


[[tool.mypy.overrides]]
module = "environ.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "rest_framework.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "django.contrib.gis.*"
ignore_errors = false

[[tool.mypy.overrides]]
module = "django.contrib.postgres.*"
ignore_errors = false

[[tool.mypy.overrides]]
module = "apps.telemetry_ingestion.management.commands.run_lightstreamer"
disable_error_code = ["attr-defined"]

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "F", "I", "UP"]
ignore = ["E501", "F403"]
exclude = [
    "migrations/**",
    "**/migrations/**",
    ".git",
    "**/__pycache__/**",
    "*.egg-info/**",
    ".ruff_cache/**",
    "htmlcov/**",
    "manage.py",
]

[tool.ruff.lint.per-file-ignores]
"config/settings/*" = ["F403", "F405"]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["peebot", "apps", "config"]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"
line-ending = "auto"
exclude = [
    "migrations/**",
    "**/migrations/**",
    ".git",
    "**/__pycache__/**",
    "*.egg-info/**",
    ".ruff_cache/**",
    "htmlcov/**",
    "manage.py",
]

[tool.ty.rules]
# Make ty ignore the things mypy will catch later
unresolved-attribute = "warn"
unresolved-import = "warn"


[dependency-groups]
dev = [
    "debugpy>=1.8.18",
    "django-stubs>=5.2.7",
    "model-bakery>=1.20.5",
    "mypy>=1.18.2",
    "pre-commit>=4.5.1",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-django>=4.11.1",
    "ruff>=0.14.1",
    "types-defusedxml>=0.7.0.20250822",
    "types-python-dateutil>=2.9.0.20260124",
    "types-redis>=4.6.0.20241004",
    "types-requests>=2.32.4.20260107",
    "types-setuptools>=80.10.0.20260124",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.testing"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
