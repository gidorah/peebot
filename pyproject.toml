[project]
name = "peebot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "celery>=5.5.3",
    "django>=5.2.7",
    "django-celery-beat>=2.8.1",
    "django-environ>=0.12.0",
    "django-stubs>=5.2.7",
    "djangorestframework>=3.16.1",
    "flower>=2.0.1",
    "model-bakery>=1.20.5",
    "mypy>=1.18.2",
    "psycopg[binary,pool]>=3.2.11",
    "pyrefly>=0.42.3",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-django>=4.11.1",
    "redis>=6.4.0",
    "ruff>=0.14.1",
]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
disallow_untyped_decorators = false
plugins = ["mypy_django_plugin.main"]

[[tool.mypy.overrides]]
module = "django_celery_beat.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "django_celery_results.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "django.contrib.gis.*"
ignore_errors = false

[[tool.mypy.overrides]]
module = "django.contrib.postgres.*"
ignore_errors = false

[tool.django-stubs]
django_settings_module = "config.settings.development"
[[tool.mypy.overrides]]
module = "celery.*"
ignore_missing_imports = true

[tool.pyrefly]
project-includes = ["**/*.py"]
project-excludes = ["**/.[!/.]*", "**/*venv/**"]
search-path = ["."]
ignore-errors-in-generated-code = true
python-version = "3.13.0"
untyped-def-behavior = "check-and-infer-return-any"
ignore-missing-imports = [
    "django_celery_beat.*",
    "django_celery_results.*",
    "celery.*",
    "environ.*",
]

[tool.pyrefly.errors]
untyped-import = true
bad-override = true
bad-param-name-override = true
redundant-cast = true
redundant-condition = true
unused-coroutine = true
deprecated = true
implicit-import = true

[[tool.mypy.overrides]]
module = "environ.*"
ignore_missing_imports = true

[tool.ruff]
line-length = 88
exclude = [
    "migrations",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"config/settings/*" = ["F403", "F405"]