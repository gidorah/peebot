[project]
name = "peebot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "atproto>=0.0.68",
    "celery>=5.6.3",
    "defusedxml>=0.7.1",
    "django>=5.2.7",
    "django-celery-beat>=2.9.0",
    "django-environ>=0.13.0",
    "djangorestframework>=3.17.1",
    "drf-spectacular>=0.28.0",
    "gunicorn>=23.0.0",
    "lightstreamer-client-lib>=2.2.2",
    "openai>=2.41.1",
    "psycopg[binary,pool]>=3.3.3",
    "pydantic>=2.13.4",
    "redis>=6.4.0",
    "sentry-sdk[django]>=2.58.0",
    "structlog>=25.5.0",
    "whitenoise>=6.12.0",
]

[tool.mypy]
python_version = "3.14"
# strict = true  # DISABLED: Django's metaclasses make strict mode self-sabotage
plugins = ["mypy_django_plugin.main"]
exclude = ["migrations/", "tests/", "_work-tmp"]

# High-value strict checks (enabled selectively for non-Django code)
disallow_untyped_defs = false  # Too strict for Django views/models
check_untyped_defs = true      # Check typed functions thoroughly
warn_return_any = false        # Django QuerySets return Any frequently
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
no_implicit_optional = true    # Catch None bugs
strict_equality = true          # Prevent type mismatches in comparisons

# Django-specific relaxations
allow_redefinition = true       # Supports Django's descriptor magic
implicit_reexport = true        # Django models re-export fields

[[tool.mypy.overrides]]
module = "django_celery_beat.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "django_celery_results.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "lightstreamer.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "celery.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "environ.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "rest_framework.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "atproto.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "sentry_sdk.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "django.contrib.gis.*"
ignore_errors = false

[[tool.mypy.overrides]]
module = "django.contrib.postgres.*"
ignore_errors = false

# Django infrastructure: relax checks on metaclass-heavy modules
# - models/admin: Currently clean, but guardrails against future ORM metaclass noise
# - config.settings.*: REQUIRED — dict indexing on LOGGING triggers [index]
[[tool.mypy.overrides]]
module = [
    "apps.*.models",
    "apps.*.admin",
    "config.settings.*",
]
disable_error_code = ["attr-defined", "misc", "override", "index"]
warn_return_any = false

# Enforce stricter typing on business logic (services, processors, utils)
# This is where bugs actually hide
[[tool.mypy.overrides]]
module = [
    "apps.*.services.*",
    "apps.*.processors.*",
    "apps.*.utils.*",
    "apps.*.repositories.*",
]
disallow_untyped_defs = true
warn_return_any = true
strict_equality = true

[tool.django-stubs]
django_settings_module = "config.settings.development"

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "F", "I", "UP", "D"]
ignore = [
    "E501",
    "F403",
    "D104",  # Missing docstring in public package (__init__.py): noisy, not useful
    "D105",  # Missing docstring in magic method: __str__ etc. speak for themselves
    "D106",  # Missing docstring in nested class: Django Meta classes are config, not public API
    "D107",  # Missing docstring in __init__: Google convention prefers class-level docstring
]
exclude = [
    "migrations/**",
    "**/migrations/**",
    ".git",
    "**/__pycache__/**",
    "*.egg-info/**",
    ".ruff_cache/**",
    "htmlcov/**",
    "manage.py",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"config/settings/*" = ["F403", "F405"]
# Tests don't need per-function docstrings — pytest test names carry the intent.
"apps/**/tests/**/*.py" = ["D101", "D102", "D103"]
"tests/**/*.py" = ["D101", "D102", "D103"]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["peebot", "apps", "config"]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"
line-ending = "auto"
exclude = [
    "migrations/**",
    "**/migrations/**",
    ".git",
    "**/__pycache__/**",
    "*.egg-info/**",
    ".ruff_cache/**",
    "htmlcov/**",
    "manage.py",
]

[tool.ty.rules]
# Make ty ignore the things mypy will catch later
unresolved-attribute = "warn"
unresolved-import = "warn"


[dependency-groups]
dev = [
    "debugpy>=1.8.21",
    "django-structlog>=10.1.0",
    "flower>=2.0.1",
    "rich>=15.0.0",
    "seqlog>=0.4.3",
    "django-stubs>=6.0.5",
    "model-bakery>=1.23.5",
    "mypy>=1.18.2",
    "pre-commit>=4.6.0",
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
    "pytest-django>=4.12.0",
    "ruff>=0.15.17",
    "types-defusedxml>=0.7.0.20260408",
    "types-python-dateutil>=2.9.0.20260408",
    "types-redis>=4.6.0.20241004",
    "types-requests>=2.33.0.20260518",
    "types-setuptools>=80.10.0.20260124",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.testing"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
