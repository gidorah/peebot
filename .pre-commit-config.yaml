repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.0
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        require_serial: true
        exclude: '(?:^|/)(?:migrations|tests)/'
        # Run on all files if any python file changes, or restrict?
        # Mypy usually needs full context.
        # But for speed, let's try to pass filenames.
        # However, since we use `uv run`, it's fast.
        # Let's align with Justfile and project config.
        # If I pass filenames, I need to ensure mypy config allows it.
        # Safest for consistent results is usually full run or using pre-commit cache.
        # Let's start with passing filenames (default) which is faster.
