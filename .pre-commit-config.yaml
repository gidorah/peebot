repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.0
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy apps/
        language: system
        types: [python]
        require_serial: true
        pass_filenames: false
        # Run on entire apps/ directory for full context (matches `just dev-check`)
        # Mypy needs full context for Django's metaclasses and module overrides
        # Exclusions (migrations, tests) handled by pyproject.toml config
