name: PR Quality

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

concurrency:
  group: pr-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: ruff
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install project dependencies
        run: uv sync --frozen --dev

      - name: Run Ruff
        run: uv run ruff check .

  mypy:
    name: mypy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SECRET_KEY: django-ci-mypy-key
      DATABASE_URL: postgresql://peebot_user:password@127.0.0.1:5432/peebot?application_name=github-actions-mypy
      ALLOWED_HOSTS: localhost,127.0.0.1

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install project dependencies
        run: uv sync --frozen --dev

      - name: Run mypy
        run: uv run mypy apps/
