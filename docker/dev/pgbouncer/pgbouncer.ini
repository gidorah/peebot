# ==============================================================================
# PgBouncer Configuration - Development Environment
# ==============================================================================
# Connection pooler for TimescaleDB with session-based pooling
# Optimized for development workload: ~10-12 concurrent workers
# ==============================================================================

# ==============================================================================
# DATABASE CONNECTIONS
# ==============================================================================
[databases]
# Route 'peebot' database through PgBouncer to TimescaleDB
# auth_user: Special superuser for pg_shadow authentication queries
peebot = host=timescaledb port=5432 dbname=peebot auth_user=pgbouncer_auth

# NOTE: test_peebot is intentionally NOT routed through PgBouncer because:
# 1. pytest-django needs to CREATE/DROP the test database each run
# 2. PgBouncer's min_pool_size keeps connections alive, blocking DROP DATABASE
# 3. Tests use direct connection (TEST_DATABASE_URL) which is industry standard

# ==============================================================================
# CONNECTION SETTINGS
# ==============================================================================
[pgbouncer]
# Network binding
# Accept connections from any interface (Docker networking)
listen_addr = 0.0.0.0

# Standard PgBouncer port (5432 reserved for direct Postgres)
listen_port = 6432

# Unix socket location for local connections
unix_socket_dir = /tmp

# ------------------------------------------------------------------------------
# AUTHENTICATION
# ------------------------------------------------------------------------------
# Hybrid authentication model:
# 1. pgbouncer_auth user credentials stored in userlist.txt (PLAINTEXT password)
# 2. Application users (peebot_user) authenticated via auth_query against PostgreSQL
# 3. auth_query requires pgbouncer_auth to have superuser privileges to read pg_shadow
#
# ⚠️  IMPORTANT: userlist.txt must contain PLAINTEXT password when using auth_query
#    PgBouncer requires plaintext to complete SCRAM-SHA-256 challenge-response with PostgreSQL
#    This is documented behavior: https://www.pgbouncer.org/config.html#auth_file

# Modern password auth (secure)
auth_type = scram-sha-256

# Contains pgbouncer_auth plaintext password (required for auth_query)
auth_file = /etc/pgbouncer/userlist.txt

# Superuser for running auth_query
auth_user = pgbouncer_auth

# Database to use for auth_query lookups (use main application database)
auth_dbname = peebot

auth_query = SELECT usename, passwd FROM pg_catalog.pg_shadow WHERE usename=$1

# ------------------------------------------------------------------------------
# POOLING MODE
# ------------------------------------------------------------------------------
# Session mode: Each client connection gets a dedicated backend connection
# for the entire session duration. Required for Django ORM compatibility
# (supports all PostgreSQL features: prepared statements, temp tables, locks)
pool_mode = session

# Clean connection state before reuse - prevents state bleed between Django requests
# DISCARD ALL clears: prepared statements, temporary tables, advisory locks, session GUCs
server_reset_query = DISCARD ALL

# Ignore client startup parameters that don't affect query behavior
ignore_startup_parameters = extra_float_digits, options

# ------------------------------------------------------------------------------
# CONNECTION POOL SIZING (Optimized for Development)
# ------------------------------------------------------------------------------
# Development workload analysis:
#   Django web (runserver):  1-2 threads
#   Celery workers:          2 workers
#   Celery beat:             1 scheduler
#   Lightstreamer client:    1 async process
#   Manual operations:       2-3 (migrations, dbshell, shell_plus)
#   Test buffer:             2-3
# ------------------------------
#   Typical concurrent:      ~10-12 connections
#   Peak with tests:         ~15 connections

# Max total client connections (5x typical usage = easy leak detection)
max_client_conn = 50

# Max connections per user (safety limit)
max_user_connections = 50

# Backend connections per database (matches typical 10-12 workers)
default_pool_size = 10

# Keep 2 warm connections (instant query response, no cold start)
min_pool_size = 2

# Emergency pool for burst traffic/tests (beyond default pool)
reserve_pool_size = 3

# Seconds to wait for reserve pool connection
reserve_pool_timeout = 5.0

# Hard limit to PostgreSQL (10 default + 3 reserve + 2 buffer)
max_db_connections = 15

# ------------------------------------------------------------------------------
# TIMEOUTS (Development-Tuned)
# ------------------------------------------------------------------------------
# Close idle backend after 10 min (saves resources, typical dev gap)
server_idle_timeout = 600

# Recycle backend connections hourly (ensures fresh state, catches leaks)
server_lifetime = 3600

# Kill queries running >30s (catch bad code early in dev)
query_timeout = 30

# Kill idle transactions after 60s (prevent forgotten BEGIN blocks)
idle_transaction_timeout = 60

# ------------------------------------------------------------------------------
# LOGGING (Verbose for Development)
# ------------------------------------------------------------------------------
# Log each client connection (debug connection issues)
log_connections = 1

# Log client disconnections (debug lifecycle)
log_disconnections = 1

# Log pooling errors (catch pool exhaustion early)
log_pooler_errors = 1

# Report stats every 60 seconds (monitor pool health)
stats_period = 60

# Verbose logging for development debugging
verbose = 1

# ------------------------------------------------------------------------------
# ADMIN ACCESS
# ------------------------------------------------------------------------------
# Admin console accessible via: psql -h localhost -p 6432 -U postgres pgbouncer
# Commands: SHOW POOLS; SHOW STATS; SHOW SERVERS; SHOW CLIENTS; RELOAD;
admin_users = postgres, pgbouncer_auth

# ------------------------------------------------------------------------------
# TLS/SSL (Disabled for Local Development)
# ------------------------------------------------------------------------------
# Production should enable TLS:
#   client_tls_sslmode = prefer
#   server_tls_sslmode = require

# No client TLS in dev (localhost only)
client_tls_sslmode = disable

# No server TLS to TimescaleDB (isolated Docker network)
server_tls_sslmode = disable

# ==============================================================================
# USAGE NOTES
# ==============================================================================
# Direct TimescaleDB access (for psql, GUI tools, debugging):
#   postgresql://peebot_user:password@localhost:5432/peebot
#
# Application access via PgBouncer (recommended for all Django services):
#   postgresql://peebot_user:password@localhost:6432/peebot?application_name=django-web
#
# PgBouncer admin console:
#   psql -h localhost -p 6432 -U postgres pgbouncer
#   pgbouncer=# SHOW POOLS;
#   pgbouncer=# SHOW STATS;
#
# Password updates:
#   Use docker/dev/pgbouncer/generate_userlist.sh to create SCRAM hashes
#   Update userlist.txt, .env, and init-timescale.sql in sync
#
# Reload configuration without restart:
#   psql -h localhost -p 6432 -U postgres pgbouncer -c "RELOAD;"
# ==============================================================================
