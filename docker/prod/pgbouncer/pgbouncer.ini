# ==============================================================================
# PgBouncer Configuration - Production Environment
# ==============================================================================
# Connection pooler for TimescaleDB with session-based pooling
# Hardened for production deployment with higher concurrency
# ==============================================================================

# ==============================================================================
# DATABASE CONNECTIONS
# ==============================================================================
[databases]
# Route 'peebot' database through PgBouncer to TimescaleDB
# auth_user: Special superuser for pg_shadow authentication queries
peebot = host=timescaledb port=5432 dbname=peebot auth_user=pgbouncer_auth

# ==============================================================================
# CONNECTION SETTINGS
# ==============================================================================
[pgbouncer]
# Network binding
# Accept connections from any interface
listen_addr = 0.0.0.0

# Standard PgBouncer port (5432 reserved for direct Postgres)
listen_port = 6432

# Unix socket location for local connections
unix_socket_dir = /tmp

# ------------------------------------------------------------------------------
# AUTHENTICATION
# ------------------------------------------------------------------------------
# Hybrid authentication model:
# 1. pgbouncer_auth user credentials stored in userlist.txt (PLAINTEXT password)
# 2. Application users (peebot_user) authenticated via auth_query against PostgreSQL
# 3. auth_query requires pgbouncer_auth to have superuser privileges to read pg_shadow
#
# ⚠️  IMPORTANT: userlist.txt must contain PLAINTEXT password when using auth_query
#    PgBouncer requires plaintext to complete SCRAM-SHA-256 challenge-response with PostgreSQL
#    This is documented behavior: https://www.pgbouncer.org/config.html#auth_file
#    Store userlist.txt as Docker secret with restricted permissions (mode 0600)

# Modern password auth (secure)
auth_type = scram-sha-256

# Contains pgbouncer_auth plaintext password (required for auth_query)
auth_file = /etc/pgbouncer/userlist.txt

# Superuser for running auth_query
auth_user = pgbouncer_auth

# Database to use for auth_query lookups (use main application database)
auth_dbname = peebot

auth_query = SELECT usename, passwd FROM pg_catalog.pg_shadow WHERE usename=$1

# ------------------------------------------------------------------------------
# POOLING MODE
# ------------------------------------------------------------------------------
# Session mode: Each client connection gets a dedicated backend connection
# for the entire session duration. Required for Django ORM compatibility
# (supports all PostgreSQL features: prepared statements, temp tables, locks)
pool_mode = session

# Clean connection state before reuse - prevents state bleed between Django requests
# DISCARD ALL clears: prepared statements, temporary tables, advisory locks, session GUCs
server_reset_query = DISCARD ALL

# Ignore client startup parameters that don't affect query behavior
ignore_startup_parameters = extra_float_digits, options

# ------------------------------------------------------------------------------
# CONNECTION POOL SIZING (Optimized for Production)
# ------------------------------------------------------------------------------
# Production workload analysis:
#   Gunicorn workers:       8 workers (sync)
#   Daphne workers:         4 workers (async WebSocket)
#   Celery workers:         4 workers
#   Celery beat:            1 scheduler
#   Lightstreamer client:   1 async process
#   Admin operations:       2-3 (migrations, monitoring)
# ------------------------------
#   Typical concurrent:     ~20 connections
#   Peak with load:         ~30-35 connections

# Max total client connections (allows headroom for traffic spikes)
max_client_conn = 200

# Max connections per user (safety limit)
max_user_connections = 200

# Backend connections per database (handles typical 20 + buffer)
default_pool_size = 25

# Keep 5 warm connections (faster response under sudden load)
min_pool_size = 5

# Larger emergency pool for traffic bursts
reserve_pool_size = 10

# Seconds to wait for reserve pool connection
reserve_pool_timeout = 5.0

# Hard limit to PostgreSQL (25 default + 10 reserve + 5 buffer)
max_db_connections = 40

# ------------------------------------------------------------------------------
# TIMEOUTS (Production-Hardened)
# ------------------------------------------------------------------------------
# Close idle backend after 5 min (tighter resource management)
server_idle_timeout = 300

# Recycle backend connections hourly (ensures fresh state)
server_lifetime = 3600

# Kill queries running >60s (allows complex analytics queries)
query_timeout = 60

# Kill idle transactions after 60s (prevent forgotten BEGIN blocks)
idle_transaction_timeout = 60

# ------------------------------------------------------------------------------
# LOGGING (Production-Grade)
# ------------------------------------------------------------------------------
# Disable connection logging (reduces noise in production)
log_connections = 0

# Disable disconnection logging (reduces noise)
log_disconnections = 0

# Log pooling errors (critical issues only)
log_pooler_errors = 1

# Report stats every 60 seconds (monitoring integration)
stats_period = 60

# Minimal logging for production
verbose = 0

# ------------------------------------------------------------------------------
# ADMIN ACCESS
# ------------------------------------------------------------------------------
# Admin console accessible via: psql -h localhost -p 6432 -U postgres pgbouncer
# Commands: SHOW POOLS; SHOW STATS; SHOW SERVERS; SHOW CLIENTS; RELOAD;
# SECURITY: Restrict admin access via firewall rules in production
admin_users = postgres, pgbouncer_auth

# ------------------------------------------------------------------------------
# TLS/SSL (Production - Enable for Security)
# ------------------------------------------------------------------------------
# CRITICAL: Configure TLS certificates for production deployment
# Client TLS: Application to PgBouncer (optional but recommended)
# Server TLS: PgBouncer to TimescaleDB (required for security)
#
# Certificate locations (mount as Docker volumes):
#   client_tls_cert_file = /etc/pgbouncer/certs/pgbouncer-client.crt
#   client_tls_key_file  = /etc/pgbouncer/certs/pgbouncer-client.key
#   client_tls_ca_file   = /etc/pgbouncer/certs/ca.crt
#   server_tls_cert_file = /etc/pgbouncer/certs/pgbouncer-server.crt
#   server_tls_key_file  = /etc/pgbouncer/certs/pgbouncer-server.key
#   server_tls_ca_file   = /etc/pgbouncer/certs/ca.crt

# Accept TLS from clients (upgrade if available)
client_tls_sslmode = prefer

# Require TLS to TimescaleDB (enforce encryption)
server_tls_sslmode = require

# ------------------------------------------------------------------------------
# SECURITY HARDENING
# ------------------------------------------------------------------------------
# Additional security measures for production:
#
# 1. Network Isolation:
#    - Run PgBouncer in isolated Docker network
#    - Only expose port 6432 to application containers
#    - Never expose PgBouncer port publicly
#
# 2. Secrets Management:
#    - Store userlist.txt as Docker secret (not in git)
#    - Use strong passwords (32+ characters, random)
#    - Rotate passwords quarterly
#
# 3. Monitoring & Alerts:
#    - Monitor pool exhaustion (max_client_conn reached)
#    - Alert on connection errors (log_pooler_errors)
#    - Track query_timeout events (slow queries)
#    - Monitor server_lifetime recycling
#
# 4. Resource Limits:
#    - Set Docker container memory limits (1-2GB)
#    - Set Docker container CPU limits (1-2 cores)
#    - Configure OOM killer priority
#
# 5. Firewall Rules:
#    - Restrict admin_users access to ops network only
#    - Block external access to port 6432
#    - Allow only application containers to connect
# ------------------------------------------------------------------------------

# ==============================================================================
# PRODUCTION DEPLOYMENT CHECKLIST
# ==============================================================================
# Before deploying to production, verify:
#
# [ ] Strong passwords in userlist.txt (32+ random characters)
# [ ] TLS certificates configured and mounted
# [ ] server_tls_sslmode set to 'require'
# [ ] Docker secrets configured (not environment variables)
# [ ] Firewall rules configured (restrict port 6432)
# [ ] Monitoring integrated (Prometheus exporter)
# [ ] Alerting configured (pool exhaustion, errors)
# [ ] Backup procedures tested (database + configuration)
# [ ] Resource limits set (memory, CPU)
# [ ] Log aggregation configured (centralized logging)
# [ ] Health checks configured (readiness, liveness probes)
# [ ] Disaster recovery plan documented
# ==============================================================================
