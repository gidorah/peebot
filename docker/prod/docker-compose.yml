# ==============================================================================
# PeeBot - Production Environment
# Django Modular Monolith with TimescaleDB
# ==============================================================================
# Usage: docker compose --project-directory . -f docker/prod/docker-compose.yml up -d
#
# Deployment model (Coolify):
#   - Coolify clones the repo and builds the image from docker/prod/Dockerfile.
#   - Environment variables are injected by Coolify UI (no .env file needed).
#   - Internal service URLs use Docker DNS names (pgbouncer, redis, timescaledb).
#   - TLS termination is handled by Coolify's Traefik proxy; Django trusts it.
#   - No ports are bound to the host; Traefik routes to containers via Docker network.
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # TimescaleDB - PostgreSQL with Time-Series Extension
  # ----------------------------------------------------------------------------
  timescaledb:
    build:
      context: .
      dockerfile: docker/prod/timescaledb/Dockerfile
    container_name: peebot_timescaledb_prod
    restart: unless-stopped

    # NOTE: The timescale/timescaledb image only reads POSTGRES_* vars for
    # initial database creation (DB name, user, password, auth method).
    # Tuning parameters (shared_buffers, work_mem, etc.) are silently ignored
    # as env vars — they MUST be applied via `command: postgres -c` flags below.
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-peebot}
      POSTGRES_USER: ${POSTGRES_USER:-peebot_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD} # Required — no default in prod
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
      # Passed to init-timescale.sh for creating the pgbouncer_auth role.
      # Must match PGBOUNCER_AUTH_PASSWORD used by the PgBouncer entrypoint.
      PGBOUNCER_AUTH_PASSWORD: ${PGBOUNCER_AUTH_PASSWORD}

    # Performance tuning via -c flags (sized for a 2 GB container memory limit).
    # See design.md §4.2 for rationale.
    command: >-
      postgres
      -c shared_buffers=512MB
      -c effective_cache_size=1536MB
      -c work_mem=16MB
      -c maintenance_work_mem=128MB
      -c max_connections=50

    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Init script is baked into the image by docker/prod/timescaledb/Dockerfile.
      # No bind mount needed.

    # No external port — accessible only via Docker DNS within peebot_network_prod.

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-peebot_user} -d ${POSTGRES_DB:-peebot}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 2G
        reservations:
          cpus: "0.75"
          memory: 1G

    networks:
      - peebot_network

  # ----------------------------------------------------------------------------
  # PgBouncer - Connection Pooler (Session Mode)
  # ----------------------------------------------------------------------------
  pgbouncer:
    build:
      context: ./docker/prod/pgbouncer
      dockerfile: Dockerfile
    container_name: peebot_pgbouncer_prod
    restart: unless-stopped

    depends_on:
      timescaledb:
        condition: service_healthy

    # Entrypoint and command are defined in docker/prod/pgbouncer/Dockerfile.
    # The entrypoint generates /etc/pgbouncer/userlist.txt at startup from
    # PGBOUNCER_AUTH_PASSWORD — userlist.txt is never committed to git.

    environment:
      # Required: entrypoint generates /etc/pgbouncer/userlist.txt from this.
      PGBOUNCER_AUTH_PASSWORD: ${PGBOUNCER_AUTH_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-peebot}
      POSTGRES_USER: ${POSTGRES_USER:-peebot_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    # No external port — accessible only via Docker DNS within peebot_network_prod.

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 128M

    networks:
      - peebot_network

  # ----------------------------------------------------------------------------
  # Redis - Celery Broker & Result Backend
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: peebot_redis_prod
    restart: unless-stopped

    # AOF persistence for Celery result durability; 256 MB LRU cap (see design.md §4.5).
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru

    volumes:
      - redis_data:/data

    # No external port — accessible only via Docker DNS within peebot_network_prod.

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 128M

    networks:
      - peebot_network

  # ----------------------------------------------------------------------------
  # Django Web - Gunicorn WSGI Server
  # ----------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: docker/prod/Dockerfile
    container_name: peebot_web_prod
    restart: unless-stopped

    # Match Gunicorn's --graceful-timeout so workers can drain requests
    # before Docker sends SIGKILL.
    stop_grace_period: 30s

    # Direct exec-form invocation — no sh -c, no uv sync.
    # Dependencies are baked into the image at build time.
    # Workers=3: 2 * CPU_limit + 1 = 2 * 0.5 + 1 (memory-constrained ~170MB each).
    command:
      - gunicorn
      - config.wsgi:application
      - --bind=0.0.0.0:8000
      - --workers=3
      - --worker-class=sync
      - --worker-connections=1000
      - --max-requests=1000
      - --max-requests-jitter=100
      - --timeout=60
      - --graceful-timeout=30
      - --keep-alive=5
      - --access-logfile=-
      - --error-logfile=-
      - --log-level=info

    # Env vars injected by Coolify UI (no env_file).
    # Internal service URLs use Docker DNS names — not secrets, set here directly.
    # ${VAR} references below ensure Coolify detects and surfaces them in its UI.
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:6432/${POSTGRES_DB}?application_name=django-web
      # Celery vars kept so the broker URL is correct in Docker DNS even though
      # Gunicorn itself doesn't connect to Redis today (default falls back to localhost).
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      # Django config — set in Coolify UI
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: ${DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}

    volumes:
      - media_files:/workspace/media

    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M

    networks:
      - peebot_network

  # ----------------------------------------------------------------------------
  # Celery Worker - Background Processing
  # ----------------------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: docker/prod/Dockerfile
    container_name: peebot_worker_prod
    restart: unless-stopped

    # Direct exec-form invocation — no sh -c, no uv sync.
    command:
      - celery
      - -A
      - config
      - worker
      - --loglevel=info
      - --concurrency=2
      - --max-tasks-per-child=1000
      - --time-limit=300
      - --soft-time-limit=270
      - --hostname=worker@%h

    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:6432/${POSTGRES_DB}?application_name=django-worker
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY}
      # Optional API integrations — set in Coolify UI
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      BLUESKY_HANDLE: ${BLUESKY_HANDLE:-}
      BLUESKY_APP_PASSWORD: ${BLUESKY_APP_PASSWORD:-}
      # Preview/staging: set SOCIAL_DRY_RUN=true to detect events and record
      # would-be posts (SocialPost.external_id="dry-run://mock") without hitting
      # Bluesky or OpenRouter. Bluesky credentials are not required when enabled.
      SOCIAL_DRY_RUN: ${SOCIAL_DRY_RUN:-false}

    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy

    # 60s allows quick deploys while giving in-flight tasks a chance to finish.
    # Tasks exceeding 60s will be SIGKILL'd — acceptable trade-off for deploy
    # windows since most tasks complete within a few seconds.
    stop_grace_period: 60s

    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping --timeout=20 || exit 1"]
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 60s

    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 512M

    networks:
      - peebot_network

  # ----------------------------------------------------------------------------
  # Celery Beat - Periodic Scheduler
  # ----------------------------------------------------------------------------
  beat:
    build:
      context: .
      dockerfile: docker/prod/Dockerfile
    container_name: peebot_beat_prod
    restart: unless-stopped

    # Direct exec-form invocation — no sh -c, no uv sync.
    command:
      - celery
      - -A
      - config
      - beat
      - --loglevel=info

    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      # DATABASE_URL is required even though beat never queries the DB directly —
      # env.db() in base.py has no default and will raise ImproperlyConfigured if absent.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:6432/${POSTGRES_DB}?application_name=django-beat
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY}

    stop_grace_period: 60s

    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy

    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 256M

    networks:
      - peebot_network

  # ----------------------------------------------------------------------------
  # Ingestion - Lightstreamer ISS Telemetry Pipeline
  # ----------------------------------------------------------------------------
  ingestion:
    build:
      context: .
      dockerfile: docker/prod/Dockerfile
    container_name: peebot_ingestion_prod
    restart: unless-stopped

    # Allow Lightstreamer client to close connections gracefully on stop.
    stop_grace_period: 60s

    # Direct exec-form invocation — same image as web/worker/beat, different CMD.
    command:
      - python
      - manage.py
      - run_lightstreamer

    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:6432/${POSTGRES_DB}?application_name=django-ingestion
      SECRET_KEY: ${SECRET_KEY}

    depends_on:
      pgbouncer:
        condition: service_healthy

    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M

    networks:
      - peebot_network

# ==============================================================================
# Volumes - Persistent Data Storage
# ==============================================================================
volumes:
  postgres_data:
    name: peebot_postgres_data_prod
    driver: local

  redis_data:
    name: peebot_redis_data_prod
    driver: local

  media_files:
    name: peebot_media_files_prod
    driver: local

# ==============================================================================
# Networks - Isolated Container Communication
# ==============================================================================
networks:
  peebot_network:
    name: peebot_network_prod
    driver: bridge
